version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    groups:
      npm-dependencies:
        # Group minor and patch only. Majors get their own PR so they are
        # reviewable: on 24-08-2026 a grouped bump titled "7 updates" carried
        # typescript 5.3 -> 7.0.2, which broke typecheck (TS7 stopped
        # auto-including @types/*). A major should never arrive unlabelled.
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      vitest-major:
        # vitest and @vitest/* pin each other as exact peers, so a major bump
        # of one alone fails `npm ci` with ERESOLVE. On 25-09-2026 vitest 5
        # arrived as two separate PRs (#38, #39), each unmergeable on its own.
        # They still get their own PR, apart from the minor/patch group.
        update-types:
          - "major"
        patterns:
          - "vitest"
          - "@vitest/*"
    reviewers:
      - "olgasafonova"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    reviewers:
      - "olgasafonova"
