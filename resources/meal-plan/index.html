<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weekly Meal Plan</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --text: #1a1d21;
        --text-dim: #5b6470;
        --text-faint: #8a929e;
        --line: rgba(20, 24, 30, 0.08);
        --accent: #2f6b4f;
        --accent-soft: rgba(47, 107, 79, 0.1);
        --quick: #2f8f5b;
        --quick-bg: rgba(47, 143, 91, 0.12);
        --medium: #b7791f;
        --medium-bg: rgba(183, 121, 31, 0.12);
        --slow: #5a6b8c;
        --slow-bg: rgba(90, 107, 140, 0.12);
        --deal: #b23a48;
        --deal-bg: rgba(178, 58, 72, 0.12);
        --shadow:
          0 0 0 1px rgba(20, 24, 30, 0.05), 0 1px 2px -1px rgba(20, 24, 30, 0.08),
          0 3px 8px -2px rgba(20, 24, 30, 0.06);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181c;
          --surface: #212429;
          --text: #eef1f4;
          --text-dim: #a6adb8;
          --text-faint: #737b87;
          --line: rgba(255, 255, 255, 0.08);
          --accent: #6fce9f;
          --accent-soft: rgba(111, 206, 159, 0.14);
          --quick: #6fce9f;
          --quick-bg: rgba(111, 206, 159, 0.16);
          --medium: #e2b25a;
          --medium-bg: rgba(226, 178, 90, 0.16);
          --slow: #9aabce;
          --slow-bg: rgba(154, 171, 206, 0.16);
          --deal: #f08b96;
          --deal-bg: rgba(240, 139, 150, 0.16);
          --shadow:
            0 0 0 1px rgba(255, 255, 255, 0.06),
            0 1px 2px -1px rgba(0, 0, 0, 0.4), 0 3px 8px -2px rgba(0, 0, 0, 0.35);
        }
      }

      /* Host-driven theme overrides win over the OS preference. */
      :root[data-theme="light"] {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --text: #1a1d21;
        --text-dim: #5b6470;
        --text-faint: #8a929e;
        --line: rgba(20, 24, 30, 0.08);
        --accent: #2f6b4f;
        --accent-soft: rgba(47, 107, 79, 0.1);
        --quick: #2f8f5b;
        --quick-bg: rgba(47, 143, 91, 0.12);
        --medium: #b7791f;
        --medium-bg: rgba(183, 121, 31, 0.12);
        --slow: #5a6b8c;
        --slow-bg: rgba(90, 107, 140, 0.12);
        --deal: #b23a48;
        --deal-bg: rgba(178, 58, 72, 0.12);
        --shadow:
          0 0 0 1px rgba(20, 24, 30, 0.05),
          0 1px 2px -1px rgba(20, 24, 30, 0.08),
          0 3px 8px -2px rgba(20, 24, 30, 0.06);
      }
      :root[data-theme="dark"] {
        --bg: #16181c;
        --surface: #212429;
        --text: #eef1f4;
        --text-dim: #a6adb8;
        --text-faint: #737b87;
        --line: rgba(255, 255, 255, 0.08);
        --accent: #6fce9f;
        --accent-soft: rgba(111, 206, 159, 0.14);
        --quick: #6fce9f;
        --quick-bg: rgba(111, 206, 159, 0.16);
        --medium: #e2b25a;
        --medium-bg: rgba(226, 178, 90, 0.16);
        --slow: #9aabce;
        --slow-bg: rgba(154, 171, 206, 0.16);
        --deal: #f08b96;
        --deal-bg: rgba(240, 139, 150, 0.16);
        --shadow:
          0 0 0 1px rgba(255, 255, 255, 0.06),
          0 1px 2px -1px rgba(0, 0, 0, 0.4), 0 3px 8px -2px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        font-family:
          var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            Helvetica, Arial, sans-serif);
        -webkit-font-smoothing: antialiased;
        line-height: 1.4;
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
      }

      header.summary {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px 20px;
        padding-bottom: 16px;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--line);
      }

      .summary h1 {
        font-size: 1.15rem;
        font-weight: 650;
        margin: 0;
        letter-spacing: -0.01em;
        text-wrap: balance;
      }

      .summary .metrics {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
        margin-left: auto;
        font-size: 0.85rem;
      }

      .metric {
        color: var(--text-dim);
        font-variant-numeric: tabular-nums;
      }
      .metric b {
        color: var(--text);
        font-weight: 650;
      }
      .metric.saving b {
        color: var(--accent);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 14px;
      }

      .card {
        background: var(--surface);
        border-radius: 14px;
        padding: 15px 16px 16px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 128px;
        transition: box-shadow 160ms ease;
        animation: enter 520ms cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        animation-delay: calc(var(--i, 0) * 55ms);
      }

      .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .day {
        font-size: 0.68rem;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-faint);
      }

      .deal-badge {
        font-size: 0.66rem;
        font-weight: 650;
        letter-spacing: 0.03em;
        color: var(--deal);
        background: var(--deal-bg);
        padding: 3px 8px;
        border-radius: 999px;
        white-space: nowrap;
      }

      .name {
        font-size: 1.02rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
        text-wrap: balance;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 0.72rem;
        color: var(--text-dim);
      }
      .tag {
        text-transform: capitalize;
      }
      .dot {
        color: var(--text-faint);
      }

      .card-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: auto;
        padding-top: 4px;
      }

      .effort {
        font-size: 0.7rem;
        font-weight: 650;
        letter-spacing: 0.02em;
        text-transform: capitalize;
        padding: 3px 9px;
        border-radius: 999px;
      }
      .effort.quick {
        color: var(--quick);
        background: var(--quick-bg);
      }
      .effort.medium {
        color: var(--medium);
        background: var(--medium-bg);
      }
      .effort.slow {
        color: var(--slow);
        background: var(--slow-bg);
      }

      .cost {
        font-size: 0.92rem;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }
      .cost span {
        font-size: 0.72rem;
        font-weight: 500;
        color: var(--text-faint);
        margin-left: 2px;
      }

      .state {
        color: var(--text-dim);
        font-size: 0.9rem;
        padding: 40px 8px;
        text-align: center;
      }

      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="root">
        <p class="state">Loading meal plan&hellip;</p>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
